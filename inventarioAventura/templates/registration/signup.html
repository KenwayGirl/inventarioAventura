<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro de Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container my-5">
        <div class="alert alert-info display-4 text-center mb-5">
            Registro de Usuario
        </div>

        <form method="post" class="col-md-8 offset-md-2 border border-3 border-secondary rounded p-4">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="d-grid gap-2 mt-3">
                <button type="submit" class="btn btn-primary">Registrarse</button>
                <a href="{% url 'login' %}" class="btn btn-danger">Volver al Login</a>
            </div>
        </form>
    </div>
</body>
</html>
